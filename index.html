<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>30秒 結婚タイプ診断｜結婚相談所のフク先生</title>
<meta name="description" content="5つの質問で、あなたに合う出会い方がわかります。結婚相談所のフク先生の無料診断。">
<meta property="og:title" content="30秒 結婚タイプ診断｜結婚相談所のフク先生">
<meta property="og:description" content="5つの質問で、あなたに合う出会い方がわかります。">
<meta property="og:image" content="https://hudetaro.github.io/fuku-shindan/icon.png">
<meta property="og:type" content="website">
<link rel="icon" href="icon.png">
<style>
  :root { --cream:#FFF8F0; --brown:#2B2118; --pink:#D2557A; --green:#06C755; --line:#E8DCCF; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--cream); color:var(--brown); font-family:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif; }
  .wrap { max-width:480px; margin:0 auto; padding:20px 16px 40px; }
  header { text-align:center; margin-bottom:18px; }
  header .tag { display:inline-block; background:var(--pink); color:#fff; font-weight:700; font-size:13px; padding:4px 12px; border-radius:999px; }
  header h1 { font-size:24px; margin:10px 0 4px; }
  header p { margin:0; font-size:14px; color:#6b5a4a; }
  .card { background:#fff; border-radius:18px; padding:20px; box-shadow:0 2px 10px rgba(0,0,0,.06); }
  .progress { height:8px; background:var(--line); border-radius:4px; overflow:hidden; margin-bottom:16px; }
  .progress div { height:100%; background:var(--pink); width:0; transition:width .3s; }
  .qn { font-size:13px; color:var(--pink); font-weight:700; }
  .q { font-size:20px; font-weight:700; margin:6px 0 16px; line-height:1.5; }
  button.opt { display:block; width:100%; text-align:left; font:inherit; font-size:16px; padding:14px 16px; margin:10px 0; border:2px solid var(--line); border-radius:14px; background:#fff; color:var(--brown); cursor:pointer; }
  button.opt:active, button.opt:hover { border-color:var(--pink); background:#FFF0F4; }
  .result h2 { font-size:15px; color:#6b5a4a; margin:0; font-weight:700; }
  .result .type { font-size:30px; font-weight:900; color:var(--pink); margin:6px 0 12px; }
  .result p { line-height:1.75; margin:0 0 12px; }
  .result .box { background:#FFF0F4; border-radius:12px; padding:12px 14px; margin:14px 0; line-height:1.7; }
  .cta { display:block; text-align:center; background:var(--green); color:#fff; font-weight:900; font-size:18px; padding:16px; border-radius:999px; text-decoration:none; margin-top:18px; box-shadow:0 5px 0 #04913e; }
  .note { font-size:13px; color:#6b5a4a; text-align:center; margin-top:12px; line-height:1.6; }
  .again { display:block; margin:18px auto 0; background:none; border:none; color:#6b5a4a; text-decoration:underline; font:inherit; cursor:pointer; }
  footer { text-align:center; font-size:12px; color:#9a8a7a; margin-top:24px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="tag">結婚相談所のフク先生</span>
    <h1>30秒 結婚タイプ診断</h1>
    <p>5つの質問で、あなたに合う出会い方がわかります</p>
  </header>
  <div class="card" id="app"></div>
  <footer>※診断は傾向をつかむための簡易的なものです</footer>
</div>
<script>
// ▼ 公式LINEの友だち追加URL（開設後に差し替え）
const LINE_URL = "https://lin.ee/t0CD8nW";

const questions = [
  { q: "休日の過ごし方は？", o: ["予定を立ててしっかり動く", "誘われたら出かける", "1人の時間を大事にする", "気分しだいで決める"] },
  { q: "気になる人ができたら？", o: ["自分から誘う", "相手から来るのを待つ", "相手をよく観察してから決める", "条件が合うかを先に考える"] },
  { q: "結婚相手に一番大事なのは？", o: ["一緒にいて楽しいか", "安心できるか", "価値観が合うか", "生活の条件（収入・住まいなど）"] },
  { q: "恋愛がうまくいかなかったとき、多い理由は？", o: ["勢いで進んで続かない", "出会いそのものが少ない", "慎重すぎて進まない", "理想に合う人がいない"] },
  { q: "人から言われることが多いのは？", o: ["行動力がある", "優しい・いい人", "しっかりしている", "理想が高い"] },
];
// 選択肢の並び順：ア=行動派 / イ=いい人 / ウ=慎重派 / エ=条件整理
const types = [
  { name: "行動派タイプ", key: "行動派",
    desc: "出会いを作る力があり、気になる人には自分から動けるタイプです。",
    trip: "勢いで進めるぶん、相手をよく知る前に疲れてしまったり、続かなかったりしがちです。",
    fit: "最初から価値観の合う人を絞って紹介してもらえる出会い方が向いています。" },
  { name: "いい人タイプ", key: "いい人",
    desc: "優しくて安心感があり、一緒にいる人を大切にできるタイプです。",
    trip: "人柄は好かれるのに、自分から動かないぶん出会いの数が足りなくなりがちです。",
    fit: "出会いの場をあらかじめ用意してもらえる仕組みがあると、一気に進みます。" },
  { name: "慎重派タイプ", key: "慎重派",
    desc: "相手をよく見て、納得してから進めたい堅実なタイプです。",
    trip: "見極めに時間をかけるぶん、決めきれずにチャンスを逃してしまいがちです。",
    fit: "相手の情報が最初からはっきりしていて、相談できる人がそばにいる環境が向いています。" },
  { name: "条件整理タイプ", key: "条件整理",
    desc: "結婚に求めるものがはっきりしていて、将来を現実的に考えられるタイプです。",
    trip: "条件が多くなると、出会える人の幅が狭くなりがちです。",
    fit: "条件の優先順位を一緒に整理すると、出会いの幅がぐっと広がります。" },
];

const app = document.getElementById("app");
let step = 0, score = [0, 0, 0, 0];

function render() {
  if (step < questions.length) {
    const { q, o } = questions[step];
    app.innerHTML = `
      <div class="progress"><div style="width:${(step / questions.length) * 100}%"></div></div>
      <div class="qn">Q${step + 1} / ${questions.length}</div>
      <div class="q">${q}</div>
      ${o.map((t, i) => `<button class="opt" data-i="${i}">${t}</button>`).join("")}`;
    app.querySelectorAll(".opt").forEach((b) => b.onclick = () => { score[+b.dataset.i]++; step++; render(); });
    return;
  }
  const max = Math.max(...score);
  const t = types[score.indexOf(max)];
  app.innerHTML = `
    <div class="result">
      <h2>あなたは…</h2>
      <div class="type">${t.name}</div>
      <p>${t.desc}</p>
      <div class="box"><b>つまずきやすいポイント</b><br>${t.trip}</div>
      <div class="box"><b>あなたに合う出会い方</b><br>${t.fit}</div>
      <a class="cta" href="${LINE_URL}" target="_blank" rel="noopener">公式LINEで詳しい解説を受け取る</a>
      <p class="note">友だち追加のあと、トークで<br><b>「${t.key}」</b>と送ると、あなたのタイプの<br>くわしい解説と「今日からできること」が届きます</p>
      <button class="again">もう一度診断する</button>
    </div>`;
  app.querySelector(".again").onclick = () => { step = 0; score = [0, 0, 0, 0]; render(); };
}
render();
</script>
</body>
</html>
